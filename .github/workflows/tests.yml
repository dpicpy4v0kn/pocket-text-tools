name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install .
      - name: Check installed command outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          pocket-text-tools --help
          python -c "import subprocess; r = subprocess.run(['pocket-text-tools', 'slug'], input='Café notes', text=True, capture_output=True, check=True); assert r.stdout == 'cafe-notes\n'"
